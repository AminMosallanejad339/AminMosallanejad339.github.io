<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amin Mosallanejad · Bio-Data Scientist</title>
  <link rel="icon" href="LOGO.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --font-display:'Space Grotesk',sans-serif;
      --font-body:'Inter',sans-serif;
      --font-mono:'JetBrains Mono',monospace;

      --theme-blue:#00D4FF;
      --theme-green:#00FF94;
      --theme-purple:#7C3AED;
      --theme-gold:#FBBF24;
      --text-primary:#F3F4F6;
      --text-secondary:#9CA3AF;
    }

    body{
      font-family:var(--font-body);
      color:var(--text-primary);
      min-height:100vh;
      overflow:hidden;
      background-color: #05080F;
      background-image: url('poster.jpg'); /* نام فایل عکس پوستر شما */
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* لایه تیره‌کننده */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(5,8,15,0.85) 30%, rgba(5,8,15,0.0) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ---------- Particle Canvas ---------- */
    #particles-canvas{
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      z-index:1;
      pointer-events:none;
      opacity: 0.15;
    }

    /* ---------- Stage ---------- */
    .stage{
      position:fixed;
      inset:0;
      z-index:2;
      overflow:hidden;
    }
    .branches{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      opacity: 0.3;
    }

    /* خطوط اتصال زیبا */
    .gitline{
      fill:none;
      stroke:rgba(255,255,255,0.15);
      stroke-width:2.5;
      stroke-linecap:round;
      stroke-linejoin:round;
      transition:stroke .3s ease,stroke-width .3s ease,opacity .25s ease;
    }
    .gitline.dim{opacity:.1}
    .gitline.hot{stroke:var(--theme-blue);stroke-width:3;filter:drop-shadow(0 0 8px rgba(0,212,255,0.3))}
    .gitline.blog{stroke:var(--theme-gold)}
    .gitline.blog.hot{stroke:var(--theme-gold);filter:drop-shadow(0 0 8px rgba(251,191,36,0.3))}

    /* گره‌ها */
    .node{
      opacity:0;
      transition:opacity .4s ease,transform .3s ease;
      transform-box:fill-box;
      transform-origin:center;
    }
    .node.show{opacity:1}
    .node.dim{opacity:.2}
    .node.hot{transform:scale(1.5)}
    .node-core{
      fill:rgba(255,255,255,0.15);
      stroke:var(--bg-deep);
      stroke-width:2.5px;
      transition:fill .3s ease;
    }
    .node.hot .node-core{fill:var(--theme-blue);box-shadow:0 0 20px rgba(0,212,255,0.4)}
    .node.blog .node-core{fill:var(--theme-gold)}
    .node-halo{
      fill:var(--theme-blue);
      opacity:0;
      transition:opacity .3s ease;
    }
    .node.blog .node-halo{fill:var(--theme-gold)}
    .node.hot .node-halo{opacity:.25}

    /* ---------- Root (Profile) ---------- */
    .root{
      position:absolute;
      display:flex;
      flex-direction:column;
      align-items:center;
      z-index:6;
      opacity:0;
      left: 6%; 
      top: 12%;
      transform: none !important;
      animation:popIn .8s cubic-bezier(.22,.9,.28,1.2) .05s forwards;
    }
    
    .identity{
      position:absolute;
      z-index:6;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      left: 6%;
      top: 25%;
      transform: none !important;
      opacity:0;
      animation:popIn .8s cubic-bezier(.22,.9,.28,1.2) .2s forwards;
    }
    
    @keyframes popIn{
      from{opacity:0;transform:translateY(15px)}
      to{opacity:1;transform:translateY(0)}
    }

    .photo{
      object-fit:contain;
      border-radius:20px;
      border:2px solid rgba(0,212,255,0.2);
      box-shadow:0 0 0 1px rgba(0,212,255,0.1), 0 20px 60px -20px rgba(0,0,0,0.8);
      background:transparent;
      user-select:none;
      -webkit-user-drag:none;
      padding:5px;
      width:120px; 
      height:120px;
    }
    .photo-wrap{
      position:relative;
      border-radius:20px;
      margin-bottom:8px;
    }
    .photo-wrap .glow{
      position:absolute;
      inset:-24px;
      border-radius:20px;
      background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%);
      filter:blur(24px);
      pointer-events:none;
    }

    .name{
      font-family:var(--font-display);
      margin:0 0 4px;
      font-weight:700;
      letter-spacing:-0.5px;
      white-space:nowrap;
      font-size:clamp(28px,3.5vw,44px);
      line-height:1.15;
      background:linear-gradient(135deg,#fff 30%,var(--theme-blue));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .tagline{
      font-family:var(--font-body);
      margin:1px 0;
      color:var(--text-primary);
      font-size:clamp(13px,1.3vw,16px);
      white-space:nowrap;
      text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    }
    .tagline-2{
      margin:1px 0 4px;
      color:var(--theme-green);
      font-weight:500;
      font-size:clamp(12px,1.1vw,14px);
      text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    }
    
    .socials-row{
      display:flex;
      gap:10px;
      margin-top:15px;
    }
    .socials-row a{
      width:36px;height:36px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      border:1px solid rgba(255,255,255,0.2);
      color:var(--text-primary);
      transition:all .3s ease;
    }
    .socials-row a:hover{
      transform:translateY(-3px);
      border-color:var(--theme-blue);
      color:var(--theme-blue);
      background:rgba(0,212,255,0.2);
    }
    .socials-row svg{
      width:16px;height:16px;
      display:block;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
    }

    /* ---------- Leaf Labels (منوها - دقیقاً در وسط صفحه) ---------- */
    .leaf{
      position:absolute;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-family:var(--font-mono);
      font-size:clamp(11px,1.2vw,14px);
      color:var(--text-primary);
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.15);
      padding:6px 16px;
      border-radius:10px;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 4px 20px rgba(0,0,0,0.5);
      z-index:7;
      opacity:0;
      transition:opacity .5s ease,background .3s,border-color .3s,transform .3s;
      -webkit-tap-highlight-color:transparent;
    }
    .leaf.show{opacity:1}
    .leaf.center{transform:translate(10%, -50%);} /* منوها در مرکز */
    
    .leaf:hover,.leaf:focus-visible{
      background:rgba(0,212,255,0.15);
      border-color:var(--theme-blue);
    }
    .leaf.center:hover{transform:translate(10%, -50%) scale(1.05)}
    .leaf .dot{
      width:8px;height:8px;
      border-radius:50%;
      background:var(--leaf-color);
      flex:none;
      box-shadow:0 0 16px var(--leaf-color);
    }

    /* ---------- Overlay (پنجره‌های بازشونده) ---------- */
    .overlay{
      position:fixed;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }
    .overlay[hidden]{display:none}
    .scrim{
      position:absolute;
      inset:0;
      background:rgba(5,8,15,0.8);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      animation:fade .3s ease;
    }
    .sheet{
      position:relative;
      width:min(700px,100%);
      max-height:88vh;
      overflow:auto;
      background:rgba(17,24,39,0.95);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:24px;
      box-shadow:0 24px 80px rgba(0,0,0,0.8);
      padding:36px 34px 40px;
      animation:rise .35s cubic-bezier(.2,.85,.3,1);
    }
    .sheet::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;
      height:4px;
      background:linear-gradient(90deg,var(--theme-blue),var(--theme-purple),var(--theme-green));
      border-radius:24px 24px 0 0;
    }
    .sheet-close{
      position:absolute;
      top:14px;right:14px;
      width:34px;height:34px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.04);
      color:var(--text-secondary);
      cursor:pointer;
      font-size:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .3s ease;
    }
    .sheet-close:hover{
      color:var(--text-primary);
      transform:rotate(90deg);
      background:rgba(255,255,255,0.06);
    }
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

    /* ---------- Panel Content ---------- */
    .p-eyebrow{
      display:flex;
      align-items:center;
      gap:9px;
      font-family:var(--font-mono);
      color:var(--theme-blue);
      font-size:11px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
      margin:0 0 8px;
    }
    .p-eyebrow .dot{
      width:8px;height:8px;
      border-radius:50%;
      background:var(--theme-blue);
    }
    .p-title{
      font-family:var(--font-display);
      font-weight:600;
      font-size:28px;
      margin:0 0 4px;
      letter-spacing:-0.5px;
    }
    .p-lead{
      color:var(--text-secondary);
      margin:0 0 20px;
      font-size:13px;
      line-height:1.7;
    }
    .timeline{ display:flex; flex-direction:column; gap:16px; }
    .t-item{
      padding-left:16px;
      border-left:2px solid rgba(255,255,255,0.06);
      position:relative;
    }
    .t-item::before{
      content:'';
      position:absolute;
      left:-6px;top:5px;
      width:10px;height:10px;
      border-radius:50%;
      background:var(--theme-blue);
      box-shadow:0 0 20px rgba(0,212,255,0.2);
    }
    .t-item h4{ margin:0; font-size:13.5px; font-weight:600; }
    .t-item .org{ margin:2px 0 0; font-size:12.5px; color:var(--text-secondary); }
    .t-item .org .hl{color:var(--theme-green)}
    .t-item .date{ margin:4px 0 0; font-family:var(--font-mono); font-size:11.5px; color:var(--text-secondary); }
    .t-item ul{ font-size:12px; color:var(--text-secondary); padding-left:18px; margin:4px 0 0; line-height:1.6; }
    .pills{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .pill{
      font-size:10.5px; color:var(--text-secondary);
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
      padding:4px 12px; border-radius:999px; font-family:var(--font-mono);
    }
    .pill.accent{ color:var(--theme-blue); border-color:rgba(0,212,255,0.15); background:rgba(0,212,255,0.06); }
    .pill.green{ color:var(--theme-green); border-color:rgba(0,255,148,0.15); background:rgba(0,255,148,0.06); }
    .pill.purple{ color:var(--theme-purple); border-color:rgba(124,58,237,0.15); background:rgba(124,58,237,0.06); }
    .pill.gold{ color:var(--theme-gold); border-color:rgba(251,191,36,0.15); background:rgba(251,191,36,0.06); }
    
    .proj{ padding:14px 0; border-top:1px solid rgba(255,255,255,0.04); }
    .proj:first-of-type{border-top:none;padding-top:0}
    .proj-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .proj-head h4{ margin:0;font-size:14px;font-weight:600; }
    .proj p{ margin:4px 0 8px; font-size:12.5px; line-height:1.5; color:var(--text-secondary); }
    .proj a.gh{ color:var(--text-secondary); display:inline-flex; transition:color .3s; flex:none; }
    .proj a.gh:hover{color:var(--theme-blue)}
    .proj a.gh svg{width:17px;height:17px;fill:currentColor}
    
    .pub-year{ font-family:var(--font-mono); font-size:15px; font-weight:500; color:var(--theme-gold); margin:18px 0 10px; }
    .pub-year:first-child{margin-top:0}
    .pub{ margin:0 0 12px; }
    .pub .pt{margin:0;font-size:13px;font-weight:600;line-height:1.4}
    .pub .pa{margin:2px 0 0;font-size:11.5px;color:var(--text-secondary)}
    .pub .pj{margin:2px 0 0;font-size:11.5px;color:var(--text-secondary);font-style:italic}
    .pub .pl{margin:2px 0 0;font-size:11px;color:var(--theme-blue)}
    .pub .pl a{color:var(--theme-blue);text-decoration:none}
    .pub .pl a:hover{text-decoration:underline}
    
    .contact-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid rgba(255,255,255,0.04); }
    .contact-row:first-of-type{border-top:none}
    .contact-row .k{ font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); letter-spacing:.5px; text-transform:uppercase; }
    .contact-row .v{font-size:13px;margin-top:2px}
    
    .btn{
      display:inline-flex; align-items:center; gap:8px; margin-top:20px;
      background:linear-gradient(135deg,var(--theme-blue),var(--theme-purple)); color:#fff;
      border:none; border-radius:12px; padding:10px 20px; font-family:var(--font-body);
      font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; transition:all .3s ease;
    }
    .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,212,255,0.2); }
    .btn svg{width:15px;height:15px;fill:currentColor}
    .morelink{ display:inline-block; margin-top:14px; color:var(--theme-blue); font-size:12.5px; font-weight:500; text-decoration:none; }
    .morelink:hover{text-decoration:underline}
    
    .badge-grid{ display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 0; }
    .badge-grid .badge{
      font-size:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
      padding:3px 10px; border-radius:999px; color:var(--text-secondary); font-family:var(--font-mono);
    }
    .badge-grid .badge.accent{ color:var(--theme-blue); border-color:rgba(0,212,255,0.12); background:rgba(0,212,255,0.05); }
    .badge-grid .badge.green{ color:var(--theme-green); border-color:rgba(0,255,148,0.12); background:rgba(0,255,148,0.05); }
    .badge-grid .badge.purple{ color:var(--theme-purple); border-color:rgba(124,58,237,0.12); background:rgba(124,58,237,0.05); }
    .badge-grid .badge.gold{ color:var(--theme-gold); border-color:rgba(251,191,36,0.12); background:rgba(251,191,36,0.05); }

    /* ---------- Mobile Responsive ---------- */
    @media(max-width:1024px){
      .root{ left: 5% !important; }
      .identity{ left: 5% !important; }
      .photo{ width:100px; height:100px; }
      .leaf{ font-size:11px; padding:4px 12px; }
    }

    @media(max-width:768px){
      .root{ left: 50% !important; top: 6% !important; transform: translateX(-50%) !important; }
      .identity{ left: 50% !important; top: 25% !important; transform: translateX(-50%) !important; align-items: center !important; text-align: center; }
      .photo{ width:90px; height:90px; }
      .leaf{ font-size:10px; padding:4px 10px; }
      .socials-row a{ width:32px;height:32px; }
      .socials-row svg{ width:15px;height:15px; }
      .sheet{ padding:28px 20px 32px; }
      .p-title{ font-size:24px; }
      .name{ font-size:24px; }
    }
    
    @media(max-width:480px){
      .identity{ top: 22%; }
      .photo{ width:70px; height:70px; }
      .leaf{ font-size:9px; padding:3px 8px; }
    }
  </style>
</head>
<body>

  <!-- Particle Canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Stage -->
  <main class="stage" id="stage">
    <svg class="branches" id="branches" aria-hidden="true"></svg>

    <div class="root" id="root">
      <div class="photo-wrap">
        <div class="glow"></div>
        <img class="photo" id="photo" src="LOGO.png" alt="Amin Mosallanejad Logo">
      </div>
    </div>

    <div class="identity" id="identity">
      <h1 class="name">Amin Mosallanejad</h1>
      <p class="tagline">Bio-Data Scientist · Chemical Engineer</p>
      <p class="tagline tagline-2">ML · Biotech · Data Engineering</p>
      
      <div class="socials-row">

      </div>
    </div>
  </main>

  <!-- Overlay -->
  <div class="overlay" id="overlay" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="sheet-close" data-close aria-label="Close">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Templates -->
  <template id="tpl-about">
    <div class="p-eyebrow"><span class="dot"></span>About</div>
    <h2 class="p-title">Amin Mosallanejad</h2>
    <p class="p-lead">A Chemical Engineer turned Bio-Data Scientist with over 17 years of industrial expertise, specializing in bridging the gap between biotechnology, data science, and bioinformatics. Passionate about leveraging machine learning and advanced data engineering to optimize industrial bioprocesses, revolutionize wastewater treatment, and enhance environmental systems.</p>
    <div class="pills">
      <span class="pill accent">Bioprocess Optimization</span>
      <span class="pill green">Wastewater AI</span>
      <span class="pill purple">Bioinformatics</span>
      <span class="pill accent">Data Pipelines</span>
      <span class="pill gold">SuperPro</span>
    </div>
  </template>

  <template id="tpl-education">
    <div class="p-eyebrow"><span class="dot"></span>Education</div>

  <script>
  (function(){
    const GH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.4-1.27.74-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>';
    const SVGNS='http://www.w3.org/2000/svg';
    const ACCENT='#00D4FF';
    const BLOG_COLOR='#FBBF24';

    const TOPICS = [
      { id:'about',          label:'About',         pos:0 },
      { id:'education',      label:'Education',     pos:1 },
      { id:'experience',     label:'Experience',    pos:2 },
      { id:'projects',       label:'Projects',      pos:3 },
      { id:'publications',   label:'Publications',  pos:4 },
      { id:'skills',         label:'Skills',        pos:5 },
      { id:'certifications', label:'Certifications',pos:6 },
      { id:'languages',      label:'Languages',     pos:7 },
      { id:'contact',        label:'Contact',       pos:8 },
    ];

    const stage = document.getElementById('stage');
    const svg = document.getElementById('branches');
    const photo = document.getElementById('photo');
    const root = document.getElementById('root');
    const identity = document.getElementById('identity');
    let leaves = [];

    // محاسبه مسیرهای منحنی زیبا
    function curvedPath(sx, sy, nx, ny){
      const dx = nx - sx;
      const dy = ny - sy;
      // تنظیم انحنا: نرم‌افزاری که خط از پایین لوگو به سمت ستون وسط می‌رود
      const cp1x = sx + dx * 0.5;
      const cp1y = sy;
      const cp2x = nx - dx * 0.1;
      const cp2y = ny;
      return 'M'+sx+','+sy+' C'+cp1x+','+cp1y+' '+cp2x+','+cp2y+' '+nx+','+ny;
    }

    function build(){
      const W = stage.clientWidth, H = stage.clientHeight;
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      svg.innerHTML=''; leaves.forEach(l=>l.remove()); leaves=[];

      const cx = W/2;
      const isMobile = W < 768; 
      
      const photoR = photo.getBoundingClientRect().width/2 || 60;
      
      // محاسبه مختصات لوگو و اطلاعات (سمت چپ)
      let logoX, logoY, LeftPos;
      if(isMobile){
        logoX = cx;
        logoY = H * 0.08 + photoR;
        LeftPos = '50%';
        root.style.left = '50%'; root.style.transform = 'translateX(-50%)';
        identity.style.left = '50%'; identity.style.transform = 'translateX(-50%)';
        identity.style.alignItems = 'center';
      } else {
        logoX = W * 0.05 + photoR;
        logoY = H * 0.08 + photoR;
        LeftPos = (W * 0.05) + 'px';
        root.style.left = (W * 0.05) + 'px'; root.style.transform = 'none';
        identity.style.left = (W * 0.05) + 'px'; identity.style.transform = 'none';
        identity.style.alignItems = 'flex-start';
      }
      root.style.top = (logoY - photoR) + 'px';
      identity.style.top = (logoY + photoR + 20) + 'px';

      // محاسبه ستون مرکزی (وسط صفحه)
      let menuX;
      if(isMobile){
        menuX = 40;
      } else {
        menuX = W * 0.5; 
      }
      
      // محاسبه نقطه شروع Y برای لیست منوها
      let startY;
      if(isMobile){
        startY = H * 0.5;
      } else {
        // شروع از بخش میانی صفحه (بین لوگو و عکس چهره)
        startY = H * 0.25; 
      }
      
      const laneGap = Math.min(55, H * 0.07);
      const startX = logoX;
      const startYLine = logoY + photoR + 10; // نقطه خروج خط از زیر لوگو
      
      const items = [];
      TOPICS.forEach((tp,i)=>{
        // محاسبه Y برای هر دکمه
        let ny = startY + (i * laneGap);
        let nx = menuX;
        
        // رسم خط اتصال منحنی
        let d = curvedPath(startX, startYLine, nx, ny);

        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('class','gitline');
        path.setAttribute('d',d);
        path.dataset.id=tp.id;
        svg.appendChild(path);
        const len=path.getTotalLength();
        const delay=120+i*70;
        path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
        requestAnimationFrame(()=>{
          path.style.transition='stroke-dashoffset .65s cubic-bezier(.4,.1,.2,1) '+delay+'ms';
          path.style.strokeDashoffset='0';
        });

        const g=document.createElementNS(SVGNS,'g');
        g.setAttribute('class','node');
        g.dataset.id=tp.id;
        const halo=document.createElementNS(SVGNS,'circle');
        halo.setAttribute('class','node-halo'); halo.setAttribute('cx',nx); halo.setAttribute('cy',ny); halo.setAttribute('r',12);
        const core=document.createElementNS(SVGNS,'circle');
        core.setAttribute('class','node-core'); core.setAttribute('cx',nx); core.setAttribute('cy',ny); core.setAttribute('r',5);
        g.appendChild(halo); g.appendChild(core); svg.appendChild(g);
        setTimeout(()=>g.classList.add('show'), delay+500);

        const leaf=document.createElement('button');
        leaf.className='leaf center'; leaf.dataset.id=tp.id;
        leaf.style.setProperty('--leaf-color', ACCENT);
        let lx=nx-10, ly=ny;
        leaf.style.left=lx+'px'; leaf.style.top=ly+'px';
        leaf.textContent=tp.label;
        stage.appendChild(leaf); leaves.push(leaf);
        setTimeout(()=>leaf.classList.add('show'), delay+500);

        items.push({path,g,leaf,id:tp.id});

        const enter=()=>{ items.forEach(o=>{ const on=o.id===tp.id; o.path.classList.toggle('hot',on); o.path.classList.toggle('dim',!on); o.g.classList.toggle('hot',on); o.g.classList.toggle('dim',!on); }); };
        const leave=()=>{ items.forEach(o=>{ o.path.classList.remove('hot','dim'); o.g.classList.remove('hot','dim'); }); };
        const openIt=()=>open(tp);
        leaf.addEventListener('mouseenter',enter); leaf.addEventListener('mouseleave',leave);
        g.addEventListener('mouseenter',enter); g.addEventListener('mouseleave',leave);
        path.addEventListener('mouseenter',enter); path.addEventListener('mouseleave',leave);
        leaf.addEventListener('click',openIt);
        g.style.cursor='pointer'; g.addEventListener('click',openIt);
        path.style.cursor='pointer'; path.addEventListener('click',openIt);
      });
    }

    const overlay=document.getElementById('overlay');
    const sheet=overlay.querySelector('.sheet');
    const body=document.getElementById('sheetBody');
    function open(tp){
      const tpl=document.getElementById('tpl-'+tp.id);
      if(!tpl) return;
      body.innerHTML=tpl.innerHTML.replaceAll('__GH__',GH);
      overlay.hidden=false; sheet.scrollTop=0;
      overlay.querySelector('.sheet-close').focus();
    }
    function closeOverlay(){ overlay.hidden=true; }
    overlay.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close')) closeOverlay(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !overlay.hidden) closeOverlay(); });

    function sizePhoto(){
      const d=Math.max(80, Math.min(120, Math.min(stage.clientWidth,stage.clientHeight)*0.18));
      photo.style.width=d+'px'; photo.style.height=d+'px';
    }
    function init(){ sizePhoto(); build(); }
    let rt;
    window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(init,160); });
    if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',init);
    else init();
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); }

    // Particle Network
    (function(){
      const c = document.getElementById('particles-canvas');
      const ctx = c.getContext('2d');
      let w,h;
      let particles = [];
      const N = 70;
      const CONN = 140;

      function resize(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();

      class Particle{
        constructor(){
          this.x = Math.random() * w; this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3;
          this.r = 1 + Math.random() * 1.2;
          this.colors = ['#00D4FF','#00FF94','#7C3AED','#FBBF24'];
          this.color = this.colors[Math.floor(Math.random()*4)];
        }
        update(){ this.x += this.vx; this.y += this.vy; if(this.x < 0 || this.x > w) this.vx *= -1; if(this.y < 0 || this.y > h) this.vy *= -1; }
        draw(){
          ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
          ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowBlur = 0;
        }
      }
      for(let i=0; i<N; i++) particles.push(new Particle());

      function drawLines(){
        for(let i=0; i<particles.length; i++){
          for(let j=i+1; j<particles.length; j++){
            const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < CONN){
              const op = 1 - (dist / CONN);
              ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0,212,255,${op * 0.2})`; ctx.lineWidth = 0.5; ctx.stroke();
            }
          }
        }
      }

      function animate(){ ctx.clearRect(0,0,w,h); particles.forEach(p => { p.update(); p.draw(); }); drawLines(); requestAnimationFrame(animate); }
      animate();
      
      let mx=-1000, my=-1000;
      document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
      document.addEventListener('mouseleave', () => { mx=-1000; my=-1000; });
      setInterval(() => {
        particles.forEach(p => {
          const dx = p.x - mx; const dy = p.y - my; const dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < 100 && dist > 0){ const force = 0.4 / dist; p.vx += dx * force * 0.02; p.vy += dy * force * 0.02; }
        });
      }, 50);
    })();
  })();
  </script>
